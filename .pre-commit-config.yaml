repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.6.9"
    hooks:
      - id: ruff
  - repo: https://github.com/psf/black
    rev: "24.10.0"
    hooks:
      - id: black
  - repo: https://github.com/pre-commit/mirrors-pyright
    rev: "v1.1.405"
    hooks:
      - id: pyright
        additional_dependencies: []
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [push]
